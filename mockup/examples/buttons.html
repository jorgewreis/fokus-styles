<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Buttons</title>

    <!-- STYLES IMPORT -->
    <link rel="stylesheet" href="../../dist/css/fonts.css">
    <link rel="stylesheet" href="../../dist/css/components.css">
    <link rel="stylesheet" href="../../dist/css/helpers.css">
    <style>
        .theme-panel {
            padding: 24px;
        }

        html[data-theme="dark"] .theme-panel {
            color: var(--fs-color-text);
            background-color: var(--fs-color-surface);
        }
    </style>
    <link rel="stylesheet" href="../assets/example-theme.css">
    <script src="../assets/example-theme.js"></script>
</head>
<body>

    <div class="theme-panel">
<p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Neutro</p>
        <button type="button" class="fs-btn">Botão</button>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Sólidos</p>
        <button type="button" class="fs-btn fs-btn-primary fs-u-mr-2">Primary</button>
        <button type="button" class="fs-btn fs-btn-success fs-u-mr-2">Success</button>
        <button type="button" class="fs-btn fs-btn-warning fs-u-mr-2">Warning</button>
        <button type="button" class="fs-btn fs-btn-danger fs-u-mr-2">Danger</button>
        <button type="button" class="fs-btn fs-btn-info">Info</button>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Outline</p>
        <button type="button" class="fs-btn fs-btn-outline-primary fs-u-mr-2">Primary</button>
        <button type="button" class="fs-btn fs-btn-outline-success fs-u-mr-2">Success</button>
        <button type="button" class="fs-btn fs-btn-outline-warning fs-u-mr-2">Warning</button>
        <button type="button" class="fs-btn fs-btn-outline-danger fs-u-mr-2">Danger</button>
        <button type="button" class="fs-btn fs-btn-outline-info">Info</button>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Tamanhos</p>
        <button type="button" class="fs-btn fs-btn-primary fs-btn-sm fs-u-mr-2">Small</button>
        <button type="button" class="fs-btn fs-btn-primary fs-u-mr-2">Default</button>
        <button type="button" class="fs-btn fs-btn-primary fs-btn-lg">Large</button>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Desabilitado</p>
        <button type="button" class="fs-btn fs-btn-primary fs-u-mr-2" disabled>Button disabled</button>
        <a href="#" class="fs-btn fs-btn-primary is-disabled" aria-disabled="true">Link disabled</a>
    </div>

    

</body>
</html>
