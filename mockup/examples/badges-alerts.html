<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Badges & Alerts</title>

    <!-- STYLES IMPORT -->
    <link rel="stylesheet" href="../../dist/css/fonts.css">
    <link rel="stylesheet" href="../../dist/css/components.css">
    <link rel="stylesheet" href="../../dist/css/helpers.css">
    <style>
        .theme-panel {
            padding: 24px;
        }

        html[data-theme="dark"] .theme-panel {
            color: var(--fs-color-text);
            background-color: var(--fs-color-surface);
        }

    </style>
    <link rel="stylesheet" href="../assets/example-theme.css">
    <script src="../assets/example-theme.js"></script>
</head>
<body>

    <div class="theme-panel">
        <h2 class="fs-u-fs-lg fs-u-fw-medium">Badges e alertas</h2>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Badges — neutro e sólidos</p>
        <span class="fs-badge fs-u-mr-2">Badge</span>
        <span class="fs-badge fs-badge-primary fs-u-mr-2">Primary</span>
        <span class="fs-badge fs-badge-success fs-u-mr-2">Success</span>
        <span class="fs-badge fs-badge-warning fs-u-mr-2">Warning</span>
        <span class="fs-badge fs-badge-danger fs-u-mr-2">Danger</span>
        <span class="fs-badge fs-badge-info">Info</span>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Badges — soft e outline</p>
        <span class="fs-badge fs-badge-soft-primary fs-u-mr-2">Em revisão</span>
        <span class="fs-badge fs-badge-soft-success fs-badge-dot fs-u-mr-2">Disponível</span>
        <span class="fs-badge fs-badge-outline-warning fs-u-mr-2">Beta</span>
        <span class="fs-badge fs-badge-outline-danger">Restrito</span>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Badges — status e contagem</p>
        <span class="fs-badge fs-badge-soft-info fs-badge-dot fs-u-mr-2">Sincronizando</span>
        <span class="fs-badge fs-badge-count fs-badge-danger fs-u-mr-2" aria-label="12 notificações não lidas">12</span>
        <span class="fs-badge fs-badge-count fs-badge-primary">99+</span>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Badges — rótulo e valor</p>
        <span class="fs-badge-split fs-badge-split-primary fs-u-mr-2">
            <span class="fs-badge-split-label">New</span>
            <span class="fs-badge-split-value">0.7.1</span>
        </span>
        <span class="fs-badge-split fs-badge-split-success fs-u-mr-2">
            <span class="fs-badge-split-label">Deploy</span>
            <span class="fs-badge-split-value">Pronto</span>
        </span>
        <span class="fs-badge-split fs-badge-split-warning fs-badge-sm">
            <span class="fs-badge-split-label">API</span>
            <span class="fs-badge-split-value">Beta</span>
        </span>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mt-3 fs-u-mb-1">Badges - tamanhos</p>
        <span class="fs-badge fs-badge-primary fs-badge-sm fs-u-mr-2">Small</span>
        <span class="fs-badge fs-badge-primary fs-u-mr-2">Default</span>
        <span class="fs-badge fs-badge-primary fs-badge-lg">Large</span>

    </div>

    <script>
        if (new URLSearchParams(window.location.search).get("theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</body>
</html>
