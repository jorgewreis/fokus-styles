<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Empty State</title>

    <!-- STYLES IMPORT -->
    <link rel="stylesheet" href="../../dist/css/fonts.css">
    <link rel="stylesheet" href="../../dist/css/components.css">
    <link rel="stylesheet" href="../../dist/css/helpers.css">
    <style>
        .theme-panel {
            display: flex;
            gap: 24px;
            padding: 24px;
            background-color: var(--fs-color-subtle);
        }

        html[data-theme="dark"] .theme-panel {
            color: var(--fs-color-text);
            background-color: var(--fs-color-surface);
        }

        .card-like {
            width: 320px;
            background-color: var(--fs-color-surface);
            border-radius: var(--fs-radius-md);
        }
    </style>
    <link rel="stylesheet" href="../assets/example-theme.css">
    <script src="../assets/example-theme.js"></script>
</head>
<body>
<div class="theme-panel">
        <div class="card-like">
            <div class="fs-empty-state">
                <div class="fs-empty-state-icon" aria-hidden="true"><svg class="fs-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></div>
                <h3 class="fs-empty-state-title">Nenhum resultado encontrado</h3>
                <p class="fs-empty-state-text">Tente ajustar os filtros ou buscar por outro termo.</p>
                <button type="button" class="fs-btn fs-btn-primary">Limpar filtros</button>
            </div>
        </div>

        <div class="card-like">
            <div class="fs-empty-state">
                <div class="fs-empty-state-icon" aria-hidden="true"><svg class="fs-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
                <h3 class="fs-empty-state-title">Caixa de entrada vazia</h3>
                <p class="fs-empty-state-text">Novas mensagens aparecerão aqui.</p>
            </div>
        </div>
    </div>


</body>
</html>
