<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Upload avançado</title>

    <!-- STYLES IMPORT -->
    <link rel="stylesheet" href="../../dist/css/fonts.css">
    <link rel="stylesheet" href="../../dist/css/forms.css">
    <link rel="stylesheet" href="../../dist/css/components.css">
    <link rel="stylesheet" href="../../dist/css/helpers.css">
    <style>
        .theme-panel {
            padding: 24px;
        }

        html[data-theme="dark"] .theme-panel {
            color: var(--fs-color-text);
            background-color: var(--fs-color-surface);
        }

        .upload-demo {
            max-width: 360px;
        }
    </style>
    <link rel="stylesheet" href="../assets/example-theme.css">
    <script src="../assets/example-theme.js"></script>
</head>
<body>

    <div class="theme-panel">
<div class="fs-file-upload upload-demo" data-fs="file-upload-advanced" id="upload-claro">
            <input type="file" class="fs-file-input" id="anexos-claro" multiple>
            <label for="anexos-claro" class="fs-file-label fs-file-label-dropzone" data-fs="file-drop">
                Arraste arquivos ou clique para escolher
                <span class="fs-file-dropzone-hint">Vários arquivos, até 5MB cada</span>
            </label>
        </div>
        <button type="button" class="fs-btn fs-u-mt-2" data-simulate="upload-claro">Simular progresso do 1º arquivo</button>
    </div>

    

    <script src="../../dist/js/fokus.js"></script>
    <script>
        // Demonstra a API `setProgress`/`setError` sem depender de um backend
        // real — um `setInterval` simula um upload progressivo no 1º arquivo
        // selecionado, só pra exercitar a barra de progresso do mockup.
        document.querySelectorAll("[data-simulate]").forEach((button) => {
            button.addEventListener("click", () => {
                const rootEl = document.getElementById(button.getAttribute("data-simulate"));
                const upload = FokusStyles.FileUploadAdvanced.getInstance(rootEl);
                const firstItem = rootEl.querySelector(".fs-file-upload-item");
                if (!firstItem) return;

                const id = firstItem.getAttribute("data-file-id");
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 20;
                    upload.setProgress(id, progress);
                    if (progress >= 100) clearInterval(interval);
                }, 200);
            });
        });
    </script>
</body>
</html>
