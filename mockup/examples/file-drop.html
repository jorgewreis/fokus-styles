<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - File Input Drag-and-Drop</title>

    <!-- STYLES IMPORT -->
    <link rel="stylesheet" href="../../dist/css/fonts.css">
    <link rel="stylesheet" href="../../dist/css/forms.css">
    <link rel="stylesheet" href="../../dist/css/helpers.css">
    <style>
        .theme-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
            background-color: var(--fs-color-subtle);
        }

        html[data-theme="dark"] .theme-panel {
            color: var(--fs-color-text);
            background-color: var(--fs-color-surface);
        }

        .theme-panel > div {
            max-width: 360px;
        }

        #resultado {
            font-size: 0.85rem;
            color: var(--fs-color-muted);
        }
    </style>
    <link rel="stylesheet" href="../assets/example-theme.css">
    <script src="../assets/example-theme.js"></script>
</head>
<body>
<div class="theme-panel">
        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mb-0">Arraste um arquivo para a área abaixo (ou clique)</p>
        <div class="fs-file-upload">
            <input type="file" class="fs-file-input" id="arquivo-1">
            <label for="arquivo-1" class="fs-file-label fs-file-label-dropzone" data-fs="file-drop">
                <span>Arraste um arquivo aqui</span>
                <span class="fs-file-dropzone-hint">ou clique para escolher</span>
            </label>
        </div>
        <p id="resultado">Nenhum arquivo selecionado.</p>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mb-0">Botão padrão (mesma funcionalidade, sem o visual de dropzone)</p>
        <div class="fs-file-upload">
            <input type="file" class="fs-file-input" id="arquivo-2">
            <label for="arquivo-2" class="fs-file-label" data-fs="file-drop">Escolher arquivo</label>
        </div>

        <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mb-0">Desabilitado</p>
        <div class="fs-file-upload">
            <input type="file" class="fs-file-input" id="arquivo-3" disabled>
            <label for="arquivo-3" class="fs-file-label fs-file-label-dropzone" data-fs="file-drop">
                <span>Desabilitado</span>
            </label>
        </div>
    </div>


    <script src="../../dist/js/fokus.js"></script>
    <script>
        document.getElementById("arquivo-1").addEventListener("change", (event) => {
            const file = event.target.files[0];
            document.getElementById("resultado").textContent = file ? `Selecionado: ${file.name}` : "Nenhum arquivo selecionado.";
        });
    </script>
</body>
</html>
