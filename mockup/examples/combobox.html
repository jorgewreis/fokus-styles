<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Combobox</title>

    <!-- STYLES IMPORT -->
    <link rel="stylesheet" href="../../dist/css/fonts.css">
    <link rel="stylesheet" href="../../dist/css/components.css">
    <link rel="stylesheet" href="../../dist/css/forms.css">
    <link rel="stylesheet" href="../../dist/css/helpers.css">
    <style>
        .theme-panel {
            padding: 24px;
        }

        html[data-theme="dark"] .theme-panel {
            color: var(--fs-color-text);
            background-color: var(--fs-color-surface);
        }

        section {
            max-width: 320px;
            margin-bottom: 24px;
        }
    </style>
    <link rel="stylesheet" href="../assets/example-theme.css">
    <script src="../assets/example-theme.js"></script>
</head>
<body>

    <div class="theme-panel">
<section>
            <p class="fs-u-fs-sm fs-u-fw-medium fs-u-mb-1">Combobox — digite pra filtrar (ex.: "css")</p>
            <label for="combobox-claro" class="fs-form-label">Framework CSS favorito</label>
            <div class="fs-combobox">
                <input type="text" class="fs-form-control" id="combobox-claro" data-fs="combobox" data-fs-target="#combobox-claro-listbox" placeholder="Buscar framework…">
            </div>
            <ul class="fs-dropdown-menu fs-combobox-listbox" id="combobox-claro-listbox">
                <li class="fs-dropdown-item" data-value="bootstrap">Bootstrap</li>
                <li class="fs-dropdown-item" data-value="tailwind">Tailwind CSS</li>
                <li class="fs-dropdown-item" data-value="bulma">Bulma</li>
                <li class="fs-dropdown-item" data-value="foundation">Foundation</li>
                <li class="fs-dropdown-item" data-value="uikit">UIkit</li>
                <li class="fs-dropdown-item" data-value="cirrus">Cirrus</li>
                <li class="fs-dropdown-item" data-value="fokus">Fokus Styles</li>
                <li class="fs-dropdown-item is-disabled" data-value="descontinuado">Framework descontinuado</li>
                <li class="fs-dropdown-item is-disabled" data-fs-empty hidden>Nenhum resultado encontrado.</li>
            </ul>
        </section>
    </div>

    

    <!-- SCRIPTS IMPORT -->
    <script src="../../dist/js/fokus.js"></script>

</body>
</html>
