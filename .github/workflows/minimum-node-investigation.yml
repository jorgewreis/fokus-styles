name: Minimum Node investigation

# Investigation matrix only. It does not declare or publish supported Node engines.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.11.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies strictly from lockfile
        run: npm ci --engine-strict

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Types check
        run: npm run types:check

      - name: Documentation consistency
        run: npm run docs:check

      - name: Contrast check (WCAG AA)
        run: npm run contrast:check

      - name: Size budgets
        run: npm run size:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual tests
        run: npm run test:visual

      - name: Accessibility tests (axe)
        run: npm run test:a11y

      - name: Pack once and install the same tarball in an isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          PACK_JSON="$RUNNER_TEMP/fokus-pack-${{ matrix.node }}.json"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$PACK_JSON"
          TARBALL="$(node -e 'const p=require(process.argv[1]); if(!Array.isArray(p)||p.length!==1||p[0].name!=="fokus-styles"||p[0].version!==require("./package.json").version||!/^sha512-/.test(p[0].integrity||"")) process.exit(1); process.stdout.write(require("node:path").join(process.env.RUNNER_TEMP,p[0].filename))' "$PACK_JSON")"
          test -f "$TARBALL"
          TARBALL_SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          CONSUMER="$(mktemp -d "$RUNNER_TEMP/fokus-consumer-${{ matrix.node }}.XXXXXX")"
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({name:"fokus-styles-consumer-smoke", private:true, type:"module"}, null, 2)+"\n", {flag:"wx"})' "$CONSUMER/package.json"
          test "$(npm config get global --prefix "$CONSUMER")" = "false"
          test "$(npm prefix --prefix "$CONSUMER")" = "$CONSUMER"
          test "$(npm root --prefix "$CONSUMER")" = "$CONSUMER/node_modules"
          npm install "$TARBALL" --prefix "$CONSUMER" --global=false --ignore-scripts --no-audit --no-fund --engine-strict
          test "$(npm config get global --prefix "$CONSUMER")" = "false"
          test "$(npm prefix --prefix "$CONSUMER")" = "$CONSUMER"
          test "$(npm root --prefix "$CONSUMER")" = "$CONSUMER/node_modules"
          node scripts/smoke-packed-package.mjs "$CONSUMER"
          test "$(sha256sum "$TARBALL" | cut -d' ' -f1)" = "$TARBALL_SHA256"
