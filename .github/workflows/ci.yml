name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Types check
        run: npm run types:check

      - name: Documentation consistency
        run: npm run docs:check

      - name: Consumer package contract
        run: npm run package:check

      - name: Installed React 18 and 19 consumers
        run: npm run test:consumers

      - name: Contrast check (WCAG AA)
        run: npm run contrast:check

      - name: Size budgets
        run: npm run size:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Visual tests
        run: npm run test:visual

      - name: A11y tests (axe)
        run: npm run test:a11y

      - name: Browser interaction regressions (Chromium)
        run: npm run test:browsers -- --project=chromium tests/browser

      - name: Upload visual test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Functional and axe matrix (no screenshot baseline updates)
        run: npm run test:browsers -- --project=${{ matrix.browser }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  node-support:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {node: '18', expected: reject}
          - {node: '20', expected: reject}
          - {node: '22', expected: reject}
          - {node: '24.10.0', expected: reject}
          - {node: '24.11.0', expected: accept}
          - {node: '24', expected: accept}
          - {node: '25', expected: reject}
          - {node: '26', expected: reject}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Verify actual npm engine contract
        run: node scripts/check-engine-install.mjs ${{ matrix.expected }}
      - name: Clean install and consumer checks on supported Node
        if: matrix.expected == 'accept'
        run: |
          npm ci --engine-strict
          npm run build
          npm run package:check
          npm test
